name: Build Windows & Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Get tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
      - name: Set package.json version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref }}".Split('/')[-1]
          $ver = $tag.TrimStart('v')
          npm pkg set "version=$ver"
        shell: powershell
      - run: npm ci
      - run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*/*
      - name: Render release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref }}".Split('/')[-1]
          $ver = $tag.TrimStart('v')
          (Get-Content .github/release-body.md) -replace '\{version\}',$ver | Set-Content .github/release-body-rendered.md
        shell: powershell
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          body_path: .github/release-body-rendered.md
          files: release/*/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Get tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
      - name: Set package.json version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VER=${TAG#v}
          npm pkg set "version=$VER"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*/*
      - name: Render release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VER=${TAG#v}
          sed "s/{version}/${VER}/g" .github/release-body.md > .github/release-body-rendered.md
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          body_path: .github/release-body-rendered.md
          files: release/*/*
          generate_release_notes: true
          fail_on_unmatched_files: true